name: MLOps Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to GCS
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          dvc remote modify myremote credentialpath /tmp/sa-key.json

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json

      - name: Train model
        run: python src/train.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy: $ACC"

      - name: Compare with previous model (Bonus 4)
        run: |
          python - <<'EOF'
          import os, json
          from google.cloud import storage

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          prev_blob = bucket.blob("models/latest/metrics.json")

          with open("outputs/metrics.json") as f:
              new_metrics = json.load(f)
          new_acc = new_metrics["accuracy"]

          if prev_blob.exists():
              prev_blob.download_to_filename("/tmp/prev_metrics.json")
              with open("/tmp/prev_metrics.json") as f:
                  prev_metrics = json.load(f)
              prev_acc = prev_metrics.get("accuracy", 0.0)
              print(f"Accuracy cu: {prev_acc:.4f} | Accuracy moi: {new_acc:.4f}")
              if new_acc < prev_acc:
                  raise SystemExit(f"FAILED: Model moi ({new_acc:.4f}) kem hon model cu ({prev_acc:.4f}). Huy deploy.")
              print(f"OK: Model moi ({new_acc:.4f}) >= model cu ({prev_acc:.4f}). Tiep tuc deploy.")
          else:
              print(f"Chua co model cu. Deploy voi accuracy: {new_acc:.4f}")
          EOF

      - name: Upload model to GCS
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          # Upload model
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print(f"Uploaded model to gs://{bucket_name}/models/latest/model.pkl")

          # Upload metrics for Bonus 4 comparison
          mblob = bucket.blob("models/latest/metrics.json")
          mblob.upload_from_filename("outputs/metrics.json")
          print(f"Uploaded metrics to gs://{bucket_name}/models/latest/metrics.json")
          EOF

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt

  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL (accuracy gate >= 0.70)
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Accuracy: {acc:.4f}")
          if acc < 0.65:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.65. Deploy blocked.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.65. Proceeding to deploy.")
          EOF

  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 8
            for i in 1 2 3; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 3 attempts."
            exit 1
