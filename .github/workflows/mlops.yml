name: MLOps Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chạy unit tests trên dữ liệu ảo (không cần kết nối cloud storage).
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xác thực GCS, pull dữ liệu bằng DVC, huấn luyện mô hình, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy: $ACC"

      # Bonus 4: Tải metrics cũ từ GCS để so sánh trước khi upload model mới
      - name: Compare with previous model (Bonus 4)
        run: |
          python - <<'EOF'
          import os, json
          from google.cloud import storage

          bucket_name = os.environ.get("CLOUD_BUCKET", "${{ secrets.CLOUD_BUCKET }}")
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          prev_blob = bucket.blob("models/latest/metrics.json")

          new_metrics_path = "outputs/metrics.json"
          with open(new_metrics_path) as f:
              new_metrics = json.load(f)
          new_acc = new_metrics["accuracy"]

          if prev_blob.exists():
              prev_blob.download_to_filename("/tmp/prev_metrics.json")
              with open("/tmp/prev_metrics.json") as f:
                  prev_metrics = json.load(f)
              prev_acc = prev_metrics.get("accuracy", 0.0)
              print(f"Accuracy cũ: {prev_acc:.4f} | Accuracy mới: {new_acc:.4f}")
              if new_acc < prev_acc:
                  print(f"[CẢNH BÁO] Model mới ({new_acc:.4f}) kém hơn model hiện tại ({prev_acc:.4f}). Hủy deploy.")
                  raise SystemExit(1)
              else:
                  print(f"[OK] Model mới ({new_acc:.4f}) >= model cũ ({prev_acc:.4f}). Tiếp tục deploy.")
          else:
              print(f"Chưa có model cũ. Tiếp tục deploy với accuracy: {new_acc:.4f}")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          # Upload model
          model_blob = bucket.blob("models/latest/model.pkl")
          model_blob.upload_from_filename("models/model.pkl")
          print(f"Đã upload model lên gs://{bucket_name}/models/latest/model.pkl")

          # Upload metrics để dùng cho Bonus 4 (so sánh lần sau)
          metrics_blob = bucket.blob("models/latest/metrics.json")
          metrics_blob.upload_from_filename("outputs/metrics.json")
          print(f"Đã upload metrics lên gs://{bucket_name}/models/latest/metrics.json")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt

  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiểm tra ngưỡng chất lượng (accuracy >= 0.70).
  # Pipeline dừng lại ở đây nếu mô hình chưa đạt yêu cầu.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Accuracy nhận được: {acc:.4f}")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Hủy deploy để bảo vệ production.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.70. Tiến hành deploy.")
          EOF

  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Triển khai lên VM qua SSH sau khi eval gate qua.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Restart service để tải model mới từ GCS
            sudo systemctl restart mlops-serve

            # Chờ server khởi động
            sleep 5

            # Health check với retry
            for i in 1 2 3; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Lần thử $i thất bại, thử lại sau 5 giây..."
              sleep 5
            done

            echo "Health check thất bại sau 3 lần thử."
            exit 1
